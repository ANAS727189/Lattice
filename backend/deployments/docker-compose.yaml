version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: docs_postgres
    environment:
      POSTGRES_USER: docs_user
      POSTGRES_PASSWORD: docs_password
      POSTGRES_DB: docs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: docs_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Local S3 alternative for object storage
  minio:
    image: minio/minio
    container_name: docs_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data: